name: Update paper radar
on:
  schedule:
    - cron: "17 */2 * * *"   # every 2 hours (GitHub may delay scheduled runs)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: cp radar/topics.json docs/data/topics.json
      - run: python radar/fetch.py
      - name: Commit data
        run: |
          git config user.name "paper-radar[bot]"
          git config user.email "paper-radar@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || (git commit -m "Update paper data" && git push)
